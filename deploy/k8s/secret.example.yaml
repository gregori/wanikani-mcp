apiVersion: v1
kind: Secret
metadata:
  name: wanikani-mcp-secrets
  namespace: wanikani-mcp
type: Opaque
stringData:
  # Criado de verdade pelo workflow de CD a partir dos GitHub Secrets.
  # Token read-only: https://www.wanikani.com/settings/personal_access_tokens
  wanikani-api-token: "change-me"
  # 32+ chars aleatórios: python -c "import secrets; print(secrets.token_urlsafe(32))"
  mcp-path-secret: "change-me"
