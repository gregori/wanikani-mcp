apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanikani-mcp
  namespace: wanikani-mcp
  labels:
    app: wanikani-mcp
spec:
  # Sem estado em disco: o cache é só em memória e se refaz no restart.
  replicas: 1
  selector:
    matchLabels:
      app: wanikani-mcp
  template:
    metadata:
      labels:
        app: wanikani-mcp
    spec:
      imagePullSecrets:
        - name: ocir-secret
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: mcp
          image: <registry>/wanikani-mcp:latest
          ports:
            - containerPort: 8000
          env:
            - name: MCP_ALLOWED_HOSTS
              value: "<host>"
            - name: WANIKANI_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wanikani-mcp-secrets
                  key: wanikani-api-token
            - name: MCP_PATH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wanikani-mcp-secrets
                  key: mcp-path-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
