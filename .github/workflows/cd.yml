name: CD - Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "deploy/k8s/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

concurrency:
  group: cd-wanikani-mcp
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: wanikani-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets
        run: |
          missing=()
          for s in OCI_REGISTRY OCI_REGISTRY_USERNAME OCI_REGISTRY_PASSWORD OCI_TENANCY_NAMESPACE \
                   K8S_NODE_PUBLIC_IP OCI_SSH_PRIVATE_KEY \
                   WANIKANI_API_TOKEN MCP_PATH_SECRET INGRESS_HOST; do
            test -n "${!s}" || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes ou vazios: ${missing[*]}"
            exit 1
          fi
        env:
          OCI_REGISTRY: ${{ secrets.OCI_REGISTRY }}
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_REGISTRY_PASSWORD: ${{ secrets.OCI_REGISTRY_PASSWORD }}
          OCI_TENANCY_NAMESPACE: ${{ secrets.OCI_TENANCY_NAMESPACE }}
          K8S_NODE_PUBLIC_IP: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          WANIKANI_API_TOKEN: ${{ secrets.WANIKANI_API_TOKEN }}
          MCP_PATH_SECRET: ${{ secrets.MCP_PATH_SECRET }}
          INGRESS_HOST: ${{ secrets.INGRESS_HOST }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/setup-qemu-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGISTRY }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Nó Ampere precisa de arm64; amd64 mantém a imagem portável.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.OCI_REGISTRY }}/${{ secrets.OCI_TENANCY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create namespace and secrets via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl create namespace wanikani-mcp --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl create secret generic wanikani-mcp-secrets -n wanikani-mcp \
              --from-literal=wanikani-api-token='${{ secrets.WANIKANI_API_TOKEN }}' \
              --from-literal=mcp-path-secret='${{ secrets.MCP_PATH_SECRET }}' \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -
            sudo k3s kubectl create secret docker-registry ocir-secret -n wanikani-mcp \
              --docker-server='${{ secrets.OCI_REGISTRY }}' \
              --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
              --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
              --dry-run=client -o yaml | sudo k3s kubectl apply -f -

      - name: Sync manifests via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          source: deploy/k8s/
          target: /tmp/wanikani-mcp-manifests
          strip_components: 0

      - name: Render and apply manifests via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            set -o pipefail
            REGISTRY=${{ secrets.OCI_REGISTRY }}
            NAMESPACE=${{ secrets.OCI_TENANCY_NAMESPACE }}
            IMAGE=$REGISTRY/$NAMESPACE/${{ env.IMAGE_NAME }}:${{ github.sha }}
            sudo k3s kubectl kustomize /tmp/wanikani-mcp-manifests/deploy/k8s/ | \
              sed -e "s|<registry>/wanikani-mcp:latest|$IMAGE|g" \
                  -e "s|<registry>|$REGISTRY/$NAMESPACE|g" \
                  -e "s|<host>|${{ secrets.INGRESS_HOST }}|g" | \
              sudo k3s kubectl apply -f -
            rm -rf /tmp/wanikani-mcp-manifests

      - name: Wait for rollout via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.K8S_NODE_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl rollout status deployment/wanikani-mcp -n wanikani-mcp --timeout=180s
