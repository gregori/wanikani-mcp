[project]
name = "wanikani-mcp"
version = "0.1.0"
description = "Servidor MCP read-only com o progresso no WaniKani"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wanikani-mcp = "wanikani_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanikani_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
